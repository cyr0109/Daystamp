{# 植物：stage 0 種子 → 5 開花。花色 = 這週最多的情緒 #}
{% macro plant(stage, color, asleep=false, size=120) -%}
{% set stem_top = [118, 104, 90, 72, 54, 46][stage] %}
<svg class="plant{% if asleep %} is-asleep{% endif %}" viewBox="0 0 120 160" width="{{ size }}" height="{{ (size * 4 / 3)|int }}" role="img"
     aria-label="植物：{{ ['種子','發芽','小苗','長葉','結苞','開花'][stage] }}{% if asleep %}，正在睡覺{% endif %}">
  {% if stage == 0 %}
    <ellipse cx="60" cy="111" rx="5" ry="3.5" class="plant-seed"/>
  {% else %}
    <g class="plant-sway">
    <path d="M60 120 C 58 {{ (120 + stem_top) / 2 }}, 62 {{ (120 + stem_top) / 2 }}, 60 {{ stem_top }}" class="plant-stem"/>
    {% set leaves = [[], [[104, -1], [104, 1]], [[106, -1], [96, 1]], [[110, -1], [98, 1], [86, -1], [78, 1]],
                     [[110, -1], [98, 1], [84, -1], [72, 1], [62, -1]], [[112, -1], [100, 1], [88, -1], [76, 1], [64, -1], [56, 1]]][stage] %}
    {% for y, side in leaves %}
      <path d="M60 {{ y }} q {{ 9 * side }} -10 {{ 20 * side }} -6 q {{ -8 * side }} 9 {{ -20 * side }} 6 z" class="plant-leaf"/>
    {% endfor %}
    {% if stage == 4 %}
      <ellipse cx="60" cy="{{ stem_top - 5 }}" rx="5" ry="7" fill="{{ color }}"/>
    {% elif stage == 5 %}
      <g transform="translate(60 {{ stem_top - 8 }})">
        {% for a in [0, 72, 144, 216, 288] %}
          <ellipse cx="0" cy="-9" rx="6" ry="9.5" fill="{{ color }}" transform="rotate({{ a }})"/>
        {% endfor %}
        <circle r="4.5" class="plant-center"/>
      </g>
    {% endif %}
    </g>
  {% endif %}
  <path d="M34 120 h52 l-6 34 h-40 z" class="plant-pot"/>
  <path d="M31 116 h58 v6 h-58 z" class="plant-rim"/>
  {% if asleep %}<text x="78" y="{{ stem_top - 6 }}" class="plant-z">z z</text>{% endif %}
</svg>
{%- endmacro %}
